<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#1f4f3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road Clear">
<meta name="description" content="Police roadblock and go-slow alerts for our people for Cape Town, in Pidgin.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen map. Search or turn banner floats on top, warning card under it, control bar pinned to the bottom. */
:root {
  --bg: #f3f1ec; --surface: #ffffff; --ink: #1b1d1a; --muted: #62665e; --line: #dcd8cf;
  --police: #1f4fb8; --police-soft: #e5ecfb; --slow: #c2410c; --slow-soft: #fdeadf;
  --sign: #f5b301; --ok: #18794e; --ok-soft: #e1f3ea; --route: #2f7cf6; --on-color: #ffffff;
  --shadow: 0 6px 24px rgba(0,0,0,.18);
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bh: 140px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #141613; --surface: #1e211d; --ink: #eceee8; --muted: #a2a79c; --line: #33372f;
  --police: #7ea2f5; --police-soft: #1d2840; --slow: #fb8a52; --slow-soft: #3a2116;
  --ok: #4fc58c; --ok-soft: #15301f; --route: #5c9bff; --on-color: #111; --shadow: 0 6px 24px rgba(0,0,0,.5); color-scheme: dark }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6); }
  .leaflet-container { background: #1a1c19; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
input, select { font: inherit; font-size: 16px; color: var(--ink); }

#map { position: fixed; inset: 0; z-index: 0; }
.leaflet-bottom { bottom: var(--bh); }
.leaflet-control-attribution { font-size: 10px; }

/* Top */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: grid; gap: 8px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none; }
.top > * { pointer-events: auto; max-width: 560px; width: 100%; margin: 0 auto; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 6px 4px 14px; }
.search svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 0; outline: none; }
.search .brand { font-family: var(--display); font-weight: 800; font-size: 13px; background: var(--sign); color: #1b1d1a; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
.icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.results { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; max-height: 50vh; overflow-y: auto; }
.results button { display: grid; gap: 1px; width: 100%; text-align: left; border: 0; background: transparent; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.results button:last-child { border-bottom: 0; }
.results b { font-weight: 700; }
.results span { font-size: 13px; color: var(--muted); }
.results .empty-row { padding: 14px 16px; color: var(--muted); }

.turn { display: flex; align-items: center; gap: 12px; background: #17402a; color: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); }
.turn-icon { width: 52px; height: 52px; flex: none; display: grid; place-items: center; }
.turn-icon svg { width: 46px; height: 46px; fill: #fff; transition: transform .2s; }
.turn-text { min-width: 0; display: grid; }
.turn-text b { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.turn-text span { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.notice { background: var(--surface); border-left: 5px solid var(--sign); border-radius: 12px; padding: 10px 14px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start; }
.notice span { flex: 1; }
.notice button { border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: 0 4px; }

/* Warning card */
.warn { display: grid; gap: 10px; background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border-left: 8px solid var(--c); }
.warn.police { --c: var(--police); --cs: var(--police-soft); }
.warn.goslow { --c: var(--slow); --cs: var(--slow-soft); }
.warn-top { display: flex; align-items: center; gap: 12px; }
.warn-top .pin-icon { width: 44px; height: 44px; }
.warn-top div { min-width: 0; display: grid; }
.warn-top b { font-family: var(--display); font-size: 20px; font-weight: 800; line-height: 1.1; }
.warn-top span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.warn-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.warn-btns button { border-radius: 12px; padding: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); }
.warn-btns .still { background: var(--cs); border-color: var(--c); color: var(--c); }

/* Floating */
.fab { position: fixed; z-index: 15; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--bh) + 12px);
  width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--route); }
.fab svg { width: 24px; height: 24px; }

/* Bottom */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 24px rgba(0,0,0,.15);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.bottom > * { max-width: 560px; margin-left: auto; margin-right: auto; }
.eta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.eta div { display: grid; }
.eta b { font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--ok); line-height: 1.1; font-variant-numeric: tabular-nums; }
.eta span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.eta button { border: 0; background: #d92d20; color: #fff; font-weight: 800; border-radius: 12px; padding: 12px 20px; }
.confirm { display: grid; gap: 8px; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.confirm b { display: block; font-family: var(--display); font-size: 17px; }
.confirm-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.confirm-btns button { font-weight: 800; font-size: 18px; padding: 16px 12px; border-radius: 14px; border: 2px solid var(--ink); }
.c-yes { background: var(--ok); color: var(--on-color); border-color: var(--ok) !important; }
.c-no { background: var(--surface); }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.side { position: relative; border: 0; border-radius: 14px; padding: 10px 6px; display: grid; justify-items: center; gap: 2px; font-weight: 700; font-size: 13px; background: var(--bg); }
.side svg { width: 26px; height: 26px; }
.side.report { background: var(--slow); color: var(--on-color); }
.badge { position: absolute; top: 4px; right: 12px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #d92d20; color: #fff; font-size: 12px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.mic { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sign); color: #1b1d1a; display: grid; place-items: center; }
.mic svg { width: 34px; height: 34px; }
.mic[data-state="listening"] { background: #d92d20; color: #fff; }
.mic[data-state="speaking"] { background: var(--police); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .mic[data-state="listening"] { animation: ring 1.2s infinite; } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(217,45,32,.5); } 100% { box-shadow: 0 0 0 18px rgba(217,45,32,0); } }
.talk-line { text-align: center; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 18px; overflow-wrap: anywhere; }
.talk-line b { color: var(--ink); }
.talk-line em { font-style: normal; color: var(--ink); }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 82vh; overflow-y: auto;
  padding-top: 8px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 800; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 0; border-radius: 18px; padding: 18px 12px; display: grid; justify-items: center; gap: 8px; color: var(--on-color); font-weight: 800; font-size: 17px; font-family: var(--display); }
.tile svg { width: 44px; height: 44px; }
.tile.police { background: var(--police); } .tile.goslow { background: var(--slow); }
.tile:disabled { opacity: .5; }
.where { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.where b { color: var(--ink); }
label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
label .opt { font-weight: 400; color: var(--muted); }
.field { padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.feed { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; background: var(--surface); }
.card.police, .pop.police { --c: var(--police); --cs: var(--police-soft); }
.card.goslow, .pop.goslow { --c: var(--slow); --cs: var(--slow-soft); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kind { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); background: var(--cs); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.when { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.place { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.place small { display: block; font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--muted); margin-top: 2px; }
.note { margin: 0; overflow-wrap: anywhere; }
.votes { display: flex; gap: 8px; flex-wrap: wrap; }
.vote { font-size: 13px; font-weight: 600; border-radius: 8px; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); font-variant-numeric: tabular-nums; }
.vote[aria-pressed="true"].yes { background: var(--cs); border-color: var(--c); color: var(--c); }
.vote[aria-pressed="true"].no { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.vote.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.empty { text-align: center; padding: 24px 12px; border: 2px dashed var(--line); border-radius: 16px; color: var(--muted); display: grid; gap: 6px; }
.empty b { font-family: var(--display); font-size: 19px; color: var(--ink); }
.small { font-size: 13px; color: var(--muted); }

/* Map markers */
.pin { background: none; border: 0; }
.pin-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); color: #fff; }
.pin-icon svg { width: 22px; height: 22px; }
.pin-icon.police { background: #1f4fb8; } .pin-icon.goslow { background: #c2410c; }
.me { background: none; border: 0; }
.me-dot { width: 26px; height: 26px; position: relative; }
.me-dot i { position: absolute; inset: 4px; border-radius: 50%; background: #2f7cf6; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }
.me-dot .arrow { position: absolute; left: 50%; top: -12px; width: 0; height: 0; margin-left: -7px; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid #2f7cf6; transform-origin: 7px 25px; opacity: 0; }
.me-dot.moving .arrow { opacity: 1; }
.dest-pin { width: 22px; height: 22px; border-radius: 50%; background: #d92d20; border: 4px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.leaflet-popup-content-wrapper { background: var(--surface); color: var(--ink); border-radius: 14px; }
.leaflet-popup-tip { background: var(--surface); }
.leaflet-popup-content { margin: 12px 14px; min-width: 220px; font-family: var(--body); font-size: 14px; }
.pop { display: grid; gap: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bh) + 76px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
@media (max-width: 370px) { .mic { width: 66px; height: 66px; } .turn-text b { font-size: 24px; } }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div class="top">
  <form class="search" id="search-form" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Where you dey go?" enterkeyhint="search" aria-label="Search for where you dey go">
    <button class="icon-btn" id="q-clear" type="button" aria-label="Clear" hidden>✕</button>
    <span class="brand" id="brand">Road Clear</span>
  </form>
  <div class="results" id="results" hidden></div>
  <div class="turn" id="turn" hidden>
    <div class="turn-icon" id="turn-icon"></div>
    <div class="turn-text"><b id="turn-dist"></b><span id="turn-name"></span></div>
  </div>
  <div class="notice" id="notice" hidden><span id="notice-text"></span><button type="button" id="notice-x" aria-label="Close">✕</button></div>
  <div class="warn" id="warn" hidden>
    <div class="warn-top"><span class="pin-icon" id="warn-icon"></span><div><b id="warn-title"></b><span id="warn-sub"></span></div></div>
    <div class="warn-btns"><button class="still" id="warn-still" type="button">E still dey</button><button id="warn-clear" type="button">E don clear</button></div>
  </div>
</div>

<button class="fab" id="recenter" type="button" aria-label="Show where I dey" hidden>
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3L3 10.5l7.5 2.9L13.4 21z"/></svg>
</button>

<div class="bottom" id="bottom">
  <div class="eta" id="eta" hidden>
    <div><b id="eta-time"></b><span id="eta-info"></span></div>
    <button id="end-nav" type="button">End</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <span><span id="confirm-q">Drop this report?</span> <b id="confirm-what"></b></span>
    <div class="confirm-btns"><button class="c-yes" id="c-yes" type="button">Yes</button><button class="c-no" id="c-no" type="button">No</button></div>
  </div>
  <div class="bar">
    <button class="side" id="btn-list" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Alerts<span class="badge" id="badge" hidden>0</span>
    </button>
    <button class="mic" id="mic" type="button" data-state="idle" aria-label="Talk to Road Clear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
    </button>
    <button class="side report" id="btn-report" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Report
    </button>
  </div>
  <div class="talk-line" aria-live="polite"><b id="talk-title">Tap and talk</b> · <span id="talk-sub">"Police dey here" or "Carry me go Bellville"</span></div>
</div>

<div class="backdrop" id="backdrop" hidden></div>

<section class="sheet" id="sheet-report" hidden aria-label="Report">
  <div class="sheet-inner">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Wetin you see?</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></div>
    <div class="where" id="r-where"></div>
    <label for="r-area" id="r-area-wrap">Which area?<select class="field" id="r-area"></select></label>
    <label for="r-road">Which road or landmark? <span class="opt">(optional)</span><input class="field" id="r-road" maxlength="80" placeholder="e.g. Voortrekker Rd by Shoprite"></label>
    <label for="r-note">Extra gist <span class="opt">(optional)</span><input class="field" id="r-note" maxlength="200" placeholder="e.g. Dem dey check licence"></label>
    <div class="tiles">
      <button class="tile police" id="r-police" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg>Police roadblock</button>
      <button class="tile goslow" id="r-goslow" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="5" width="20" height="3" rx="1.5"/><rect x="2" y="10.5" width="14" height="3" rx="1.5"/><rect x="2" y="16" width="8" height="3" rx="1.5"/></svg>Go-slow</button>
    </div>
    <p class="small" style="margin:0">Tap one to send. Mount your phone; no type while you dey drive.</p>
  </div>
</section>

<section class="sheet" id="sheet-list" hidden aria-label="Alerts">
  <div class="sheet-inner">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Wetin dey road now</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></div>
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true" type="button">All</button>
      <button class="chip" data-f="police" aria-pressed="false" type="button">Police</button>
      <button class="chip" data-f="goslow" aria-pressed="false" type="button">Go-slow</button>
    </div>
    <div class="feed" id="feed"></div>
    <p class="small" style="margin:0">Police report go off after 2 hours, go-slow after 1 hour, unless person confirm say e still dey.</p>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

    const quality = (v) => /premium|enhanced|natural|neural/i.test(v.name) ? 0 : 1;
    const male = en.filter(v => MALE_NAMES.test(v.name) && !FEMALE_HINT.test(v.name))
      .sort((a, b) => (quality(a) - quality(b)) || (langRank(a) - langRank(b)));
    chosenVoice = male[0] || en.sort((a, b) => langRank(a) - langRank(b))[0] || null;
    return chosenVoice;
  }
  try { speechSynthesis.addEventListener("voiceschanged", () => { chosenVoice = undefined; }); } catch {}
  function speakTts(text) {
    return new Promise((resolve) => {
      if (!("speechSynthesis" in window)) { toast(text); return setTimeout(resolve, 1500 + text.length * 60); }
      try {
        speechSynthesis.cancel(); try { speechSynthesis.resume(); } catch {}
        const u = new SpeechSynthesisUtterance(text);
        const v = pickVoice();
        if (v) u.voice = v; else u.lang = "en-GB";
        u.rate = 0.95; u.volume = 1;
        if (busy) setTalk("speaking", "Road Clear dey talk");
        let done = false; const fin = () => { if (done) return; done = true; resolve(); };
        u.onend = fin; u.onerror = fin; setTimeout(fin, 2500 + text.length * 90);
        speechSynthesis.speak(u);
      } catch { resolve(); }
    });
  }
  function listen(ms = 7000) {
    return new Promise((resolve) => {
      if (!SR) return resolve(null);
      let rec; try { rec = new SR(); } catch { return resolve(null); }
      rec.lang = "en-NG"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
      let heard = "", done = false; curRec = rec;
      const finish = (v) => { if (done) return; done = true; clearTimeout(timer); curRec = null; try { rec.abort(); } catch {} setTimeout(() => resolve(v), 450); };
      rec.onresult = (e) => {
        heard = Array.from(e.results).map(r => r[0].transcript).join(" ");
        $("talk-sub").replaceChildren(); const em = document.createElement("em"); em.textContent = "“" + heard + "”"; $("talk-sub").append(em);
        if (e.results[e.results.length - 1].isFinal) finish(heard);
      };
      rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") micBlocked = true; finish(heard || null); };
      rec.onend = () => finish(heard || null);
      const timer = setTimeout(() => finish(heard || null), ms);
      setTalk("listening", "I dey listen…", "Talk now");
      try { rec.start(); } catch { finish(null); }
    });
  }
  async function askYesNo(question, what, spoken) {
    $("confirm-q").textContent = question; $("confirm-what").textContent = what; $("confirm").hidden = false;
    let tapped = null;
    const tapWait = new Promise(res => { $("c-yes").onclick = () => { tapped = "yes"; res(); }; $("c-no").onclick = () => { tapped = "no"; res(); }; });
    try {
      await Promise.race([say(spoken), tapWait]);
      let yn = tapped;
      if (!yn) { const voice = listen(6000); await Promise.race([voice, tapWait]); if (tapped) { try { curRec && curRec.abort(); } catch {} yn = tapped; } else yn = await voice; }
      stopTalking();
      const ans = norm(yn || "");
      if (yn && YES_RX.test(ans) && !/\bno\b/.test(ans)) return true;
      if (yn && NO_RX.test(ans)) return false;
      return null;
    } finally { $("confirm").hidden = true; }
  }
  async function readOut(area) {
    let list = activeList();
    if (area) list = list.filter(r => r.area === area);
    else if (me) list = list.filter(r => posOf(r) && hav(me, posOf(r)) < 15000);
    list = sortedByNear(list);
    const top = list.slice(0, 3);
    if (!top.length) { await say(area ? `Road free for ${area} for now. Nobody don report anything.` : [{ c: "road-free", t: "Road free near you for now. Nobody don report anything." }]); return; }
    await say(`${list.length === 1 ? "One report" : list.length + " reports"}${area ? " for " + area : " near you"}.`);
    for (const r of top) {
      const p = posOf(r), d = me && p ? `, ${sayDist(hav(me, p))} from you` : "";
      await say(`${label(r.type)} for ${[r.road, r.area].filter(Boolean).join(", ")}${d}, ${ago(lastSeen(r))}.`);
    }
    if (list.length > 3) await say(`Plus ${list.length - 3} more. Look the map when you don park.`);
  }

  async function talk() {
    if (busy) { stopTalking(); try { curRec && curRec.abort(); } catch {} return; }
    if (!SR) { setTalk("idle", "Voice no work for this browser", "Use Chrome on Android or Safari on iPhone."); return; }
    busy = true; keepScreenOn();
    try {
      await say([{ c: "talk-now", t: "Talk now." }]);
      const heard = await listen(8000);
      if (micBlocked) { await say("I no fit use your microphone. Allow microphone for this site, then try again."); return; }
      if (!heard) { await say([{ c: "no-hear", t: "I no hear you. Tap again and talk." }]); return; }

      if (STOP_RX.test(norm(heard))) { if (nav) { endNav(true); await say("Okay, I don stop the directions."); } else await say("We no dey navigate now."); return; }

      let { type, road, area } = parseReport(heard);
      const navQ = !type ? parseNav(heard) : null;
      if (navQ) {
        let list = []; try { list = await geocode(navQ); } catch {}
        if (!list.length) { await say(`I no see ${navQ}. Try say am another way, or type am for search.`); return; }
        const d = list[0];
        const ok = await askYesNo("Go here?", [d.title, d.sub].filter(Boolean).join(", "), `You wan go ${d.title}${d.sub ? ", " + d.sub.split(",")[0] : ""}? Talk yes or no.`);
        if (ok) { busy = false; await startNav(d); } else await say("Okay.");
        return;
      }
      if (!type && (ASK_RX.test(norm(heard)) || area)) { await readOut(area || ""); return; }

      if (!type) {
        await say([{ c: "police-or-goslow", t: "Na police or go-slow?" }]);
        const a = await listen(5000); type = a && detectType(a);
        if (!type) { await say("I no catch am. Tap again and talk."); return; }
      }
      // Use the phone's location unless the driver named a different area
      let pos = null;
      const here = fresh() ? nearestArea(me) : null;
      if (fresh() && (!area || area === here)) { pos = { lat: me.lat, lng: me.lng }; area = here || area || "Cape Town"; if (!road) road = await reverseRoad(pos); }
      if (!pos) {
        if (!area) {
          await say([{ c: "which-area", t: "Which area?" }]);
          const a = await listen(6000); area = a && detectArea(a);
          if (!road && a) road = detectRoad(a).road;
          if (!area) { await say("I no know that area. Tap again, or make passenger use the Report button."); return; }
        }
        const c = AREA_CENTERS[area]; pos = c ? { lat: c[0], lng: c[1] } : null;
      }
      const summary = `${label(type)} for ${road ? road + ", " : ""}${area}`;
      const ok = await askYesNo("Drop this report?", summary, [`You talk say ${summary}.`, { c: "confirm", t: "Make I drop am? Talk yes or no." }]);
      if (ok) {
        try { await store.add({ type, area, road, note: "Reported by voice", lat: pos ? pos.lat : null, lng: pos ? pos.lng : null }); ls.set("rg-myarea", area); await say([{ c: "dropped", t: "I don drop am. Thank you. Drive safe." }]); }
        catch { await say([{ c: "network-error", t: "E no go. Network get wahala. Try again small time." }]); }
      } else if (ok === false) await say([{ c: "not-dropped", t: "Okay, I no drop am." }]);
      else await say("I no hear yes, so I no drop am.");
    } finally {
      busy = false;
      setTalk("idle", "Tap and talk", nav ? "\"Stop directions\" or \"Police dey here\"" : "\"Police dey here\" or \"Carry me go Bellville\"");
    }
  }
  $("mic").addEventListener("click", talk);

  /* ===== 12. Add to Home Screen hint (once, only in a browser tab) ===== */
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (!standalone && !ls.get("rg-a2hs")) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    setTimeout(() => {
      notice(ios ? "Make Road Clear be app: tap Share (the square with arrow), then \"Add to Home Screen\"."
                 : "Make Road Clear be app: tap the ⋮ menu, then \"Add to Home screen\" or \"Install app\".");
      ls.set("rg-a2hs", "1");
    }, 4000);
  }

  /* ===== 13. Start ===== */
  store.start();
  startGps();
  loadClips();
})();
</script>
